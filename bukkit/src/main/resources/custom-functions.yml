# TrChat-compatible custom chat functions.
# {0} is replaced with the value captured from the message.

Custom:
  shareUrl:
    enabled: true
    priority: 100
    pattern: '(https?|ftp):\/\/([a-zA-Z0-9.-]+(:[0-9]+)?)(\/[^?#]*)?(\?[^#]*)?(#.*)?'
    display:
      text: "<dark_gray>[<hover:show_text:'<aqua>网站: <white>{0}</white></aqua>'><click:open_url:'{0}'><white><bold>网站</bold></white></click></hover><dark_gray>]"

  shareQQ:
    enabled: true
    priority: 100
    pattern: 'QQ( )?[1-9]([0-9]{5,11})'
    text-filter: '[1-9]([0-9]{5,11})'
    display:
      text: "<dark_gray>[<hover:show_text:'<aqua>QQ: <white>{0}</white></aqua>'><click:open_url:'https://wpa.qq.com/msgrd?v=3&uin={0}&site=qq&menu=yes'><aqua><bold>QQ</bold></aqua></click></hover><dark_gray>]"

  shareBilibili:
    enabled: true
    priority: 100
    pattern: 'BV( )?.{10}'
    text-filter: '.{12}'
    display:
      text: "<dark_gray>[<hover:show_text:'<aqua>BV号: <white>{0}</white></aqua>'><click:open_url:'https://www.bilibili.com/video/{0}'><white><bold>Bilibili</bold></white></click></hover><dark_gray>]"
