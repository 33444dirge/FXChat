name: FXChat
version: '${version}'
main: com.dirges.fxchat.bukkit.FXChatBukkit
api-version: '1.21'
folia-supported: true
authors: [33444_dirge]
depend: [PlaceholderAPI]
softdepend: [Lands, CraftEngine, CustomNameplates, BlockLocker]

commands:
  fxchat:
    description: Manage FXChat channels and configuration
    aliases: [fxc]
    usage: /fxchat <help|channel|reload|version|view|spy|ignore|sudo>
  view-item:
    description: View an item shared in FXChat
    usage: /view-item <token>
  view-inventory:
    description: View an inventory shared in FXChat
    usage: /view-inventory <token>
  view-enderchest:
    description: View an ender chest shared in FXChat
    usage: /view-enderchest <token>
  view-container:
    description: View a container shared in FXChat
    usage: /view-container <token>

permissions:
  fxchat.chat:
    default: true
  fxchat.color:
    default: false
    children:
      fxchat.color.chat.*: true
      fxchat.color.anvil.*: true
      fxchat.color.sign.*: true
  fxchat.color.chat.*:
    default: false
    children:
      fxchat.color.chat.legacy: true
      fxchat.color.chat.minimessages: true
  fxchat.color.chat.legacy:
    default: false
    children:
      fxchat.color.chat.legacy.*: true
      fxchat.color.chat.legacy.color: true
      fxchat.color.chat.legacy.bold: true
      fxchat.color.chat.legacy.underlined: true
      fxchat.color.chat.legacy.italic: true
      fxchat.color.chat.legacy.strikethrough: true
      fxchat.color.chat.legacy.obfuscated: true
      fxchat.color.chat.legacy.reset: true
  fxchat.color.chat.legacy.*:
    default: false
    children:
      fxchat.color.chat.legacy.color: true
      fxchat.color.chat.legacy.bold: true
      fxchat.color.chat.legacy.underlined: true
      fxchat.color.chat.legacy.italic: true
      fxchat.color.chat.legacy.strikethrough: true
      fxchat.color.chat.legacy.obfuscated: true
      fxchat.color.chat.legacy.reset: true
  fxchat.color.chat.legacy.color:
    default: false
  fxchat.color.chat.legacy.bold:
    default: false
  fxchat.color.chat.legacy.underlined:
    default: false
  fxchat.color.chat.legacy.italic:
    default: false
  fxchat.color.chat.legacy.strikethrough:
    default: false
  fxchat.color.chat.legacy.obfuscated:
    default: false
  fxchat.color.chat.legacy.reset:
    default: false
  fxchat.color.chat.minimessages:
    default: false
    children:
      fxchat.color.chat.minimessages.*: true
  fxchat.color.chat.minimessages.*:
    default: false
  fxchat.color.chat.minimessages.color:
    default: false
  fxchat.color.chat.minimessages.shadow-color:
    default: false
  fxchat.color.chat.minimessages.decoration:
    default: false
  fxchat.color.chat.minimessages.reset:
    default: false
  fxchat.color.chat.minimessages.click:
    default: false
  fxchat.color.chat.minimessages.hover:
    default: false
  fxchat.color.chat.minimessages.keybind:
    default: false
  fxchat.color.chat.minimessages.translatable:
    default: false
  fxchat.color.chat.minimessages.fallback:
    default: false
  fxchat.color.chat.minimessages.insertion:
    default: false
  fxchat.color.chat.minimessages.rainbow:
    default: false
  fxchat.color.chat.minimessages.gradient:
    default: false
  fxchat.color.chat.minimessages.transition:
    default: false
  fxchat.color.chat.minimessages.font:
    default: false
  fxchat.color.chat.minimessages.newline:
    default: false
  fxchat.color.chat.minimessages.selector:
    default: false
  fxchat.color.chat.minimessages.score:
    default: false
  fxchat.color.chat.minimessages.nbt:
    default: false
  fxchat.color.chat.minimessages.pride:
    default: false
  fxchat.color.chat.minimessages.sprite:
    default: false
  fxchat.color.chat.minimessages.head:
    default: false
  fxchat.color.anvil.*:
    default: false
    children:
      fxchat.color.anvil.legacy: true
      fxchat.color.anvil.minimessages: true
  fxchat.color.anvil.legacy:
    default: false
    children:
      fxchat.color.anvil.legacy.*: true
  fxchat.color.anvil.minimessages:
    default: false
    children:
      fxchat.color.anvil.minimessages.*: true
  fxchat.color.sign.*:
    default: false
    children:
      fxchat.color.sign.legacy: true
      fxchat.color.sign.minimessages: true
  fxchat.color.sign.legacy:
    default: false
    children:
      fxchat.color.sign.legacy.*: true
  fxchat.color.sign.minimessages:
    default: false
    children:
      fxchat.color.sign.minimessages.*: true
  fxchat.admin:
    default: op
  fxchat.sudo:
    default: op
  fxchat.spy:
    default: op
  fxchat.mute:
    default: op
  fxchat.function.mentionall:
    default: op
  fxchat.function.inventoryshow:
    default: true
  fxchat.function.enderchestshow:
    default: true
  fxchat.function.containershow:
    default: true
  fxchat.bypass.mentioncd:
    default: op
  fxchat.bypass.mention-allcd:
    default: op
  fxchat.bypass.itemcd:
    default: op
  fxchat.bypass.inventorycd:
    default: op
  fxchat.bypass.enderchestcd:
    default: op
  fxchat.bypass.containercd:
    default: op
